[package]
name = "tctictl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.64"
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
libc = "0.2.189"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0.85"
sys-mount = { version = "3.1.1", default-features = false }

[profile.release]
strip = true
lto = true
