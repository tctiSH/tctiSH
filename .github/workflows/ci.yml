name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Lint
        run: make lint

  images:
    name: Check Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check Images
        run: make check-images

  build:
    name: Build
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31
      # SwiftTerm draws with a Metal shader, and Xcode downloads the Metal toolchain separately.
      - name: Install the Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: make ipa GUEST=prebuilt
      - name: Upload the IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tctiSH.ipa
          path: build-ipa/tctiSH.ipa
          retention-days: 14
          if-no-files-found: error
