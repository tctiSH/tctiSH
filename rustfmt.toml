# High-level configuration, telling rustfmt which featureset to use.
edition = "2024"
style_edition = "2024"

# Configuration controlling general code style.
brace_style = "SameLineWhere"
chain_width = 60
combine_control_expr = true
control_brace_style = "AlwaysSameLine"
empty_item_single_line = true
fn_single_line = false
force_multiline_blocks = false
format_strings = false
indent_style = "Block"
inline_attribute_width = 0
match_arm_blocks = true
max_width = 100
single_line_let_else_max_width = 90
space_after_colon = true
spaces_around_ranges = false
struct_lit_single_line = true
struct_variant_width = 70
trailing_comma = "Vertical"
trailing_semicolon = true
type_punctuation_density = "Wide"
use_field_init_shorthand = true
where_single_line = false

# Configuration controlling the formatting of comments.
#
# `wrap_comments` is a ceiling, not a formatter: it breaks a line that runs past
# `comment_width` but never joins short ones back up, so on its own it cannot
# make two paragraphs agree with each other. utils/reflow-comments does the
# filling, and `make format-rust` runs it first; this catches anything that
# arrives past the limit by another route.
#
# So `comment_width` is the widest any comment may be, which is COMMENT_WIDTH in
# the Makefile -- not DOC_COMMENT_WIDTH. rustfmt has one setting for both kinds,
# and setting it to 80 would re-break every ordinary comment the reflow had just
# filled to 100. It counts the whole line, indent and `//` included.
comment_width = 100
wrap_comments = true
format_code_in_doc_comments = true
normalize_comments = true
normalize_doc_attributes = true

# Configuration controlling the formatting of macros.
format_macro_bodies = true
format_macro_matchers = true

# Configuration controlling how spacing is formatted.
blank_lines_lower_bound = 0
blank_lines_upper_bound = 1
