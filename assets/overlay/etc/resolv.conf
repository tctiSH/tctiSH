# QEMU's built-in DNS forwarder. The guest's network is QEMU user networking
# (net=192.168.100.0/24 in qemu_launcher.c), which answers DNS at .3 by asking
# the phone -- so lookups follow whatever the phone uses, VPN and private DNS
# included, rather than going to a fixed public server.
#
# Without this file musl falls back to 127.0.0.1, where nothing listens, and
# every lookup times out.
nameserver 192.168.100.3
